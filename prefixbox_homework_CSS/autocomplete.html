<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Prefixbox - Homework</title>
  </head>
  <body>
    <div class="search-form">
      <div class="search-title">Keresés:</div>
      <div class="search-input">
        <input
          type="text"
          id="keyword"
          placeholder="keresés"
          autocomplete="off"
        />
        <div id="prefixbox-autocomplete-0" class="">
          <div class="prefixbox-autocomplete-container two-column">
            <div class="col-1">
              <div class="prefixbox-group-container group-id-1">
                <div class="prefixbox-group-1-title pfbx-group-title"></div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Komód</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Szőnyeg</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Asztal</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Szekrény</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Tükör</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Fiókos szekrény</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Szék</b></span>
                </div>
                <div class="prefixbox-autocomplete-keyword-container">
                  <span><b>Iróasztal</b></span>
                </div>
              </div>
            </div>
            <div class="col-2">
              <div class="prefixbox-group-container group-id-2">
                <div class="prefixbox-group-2-title pfbx-group-title">
                  Ajánlott termékek:
                </div>
                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://image.shutterstock.com/image-vector/vintage-tiles-intricate-details-decorative-600w-570889828.jpg"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Fali csempe</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-regular-price">2.000 Ft</span>
                      <span class="prefixbox-old-price"></span>
                    </div>
                  </div>
                </div>

                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://www.shutterstock.com/image-photo/penang-malaysia-27-june-2020-600w-1765600916.jpg"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Beton - szárazbeton</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-sale-price">8.000 Ft</span>
                      <span class="prefixbox-old-price">10.000 Ft</span>
                    </div>
                  </div>
                </div>

                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://image.shutterstock.com/image-illustration/modern-interior3d-design-concept-600w-289196939.jpg"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Kanapé</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-regular-price">10.000 Ft</span>
                      <span class="prefixbox-old-price"></span>
                    </div>
                  </div>
                </div>

                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://image.shutterstock.com/image-photo/dresser-lamp-different-decor-near-600w-2613501853.jpg"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Komód</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-regular-price">23.000 Ft</span>
                      <span class="prefixbox-old-price"></span>
                    </div>
                  </div>
                </div>

                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://image.shutterstock.com/z/stock-photo-barbecue-grill-party-tasty-food-on-wooden-desk-591209330.jpg"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Faszenes BBQ grill</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-sale-price">50.000 Ft</span>
                      <span class="prefixbox-old-price">80.000 Ft</span>
                    </div>
                  </div>
                </div>

                <div class="prefixbox-autocomplete-product-container">
                  <div class="prefixbox-autocomplete-product">
                    <div class="prefixbox-autocomplete-left">
                      <img
                        src="https://homeoutlet.hu/images/product/wtmhmncahce/2/6481d9e89ac5a.webp"
                      />
                    </div>
                    <div class="prefixbox-autocomplete-body">
                      <b>Konyhabútor</b>
                    </div>
                    <div class="prefixbox-autocomplete-right">
                      <span class="prefixbox-sale-price">99.000 Ft</span>
                      <span class="prefixbox-old-price">120.000 Ft</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
